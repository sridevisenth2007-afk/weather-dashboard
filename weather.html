<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Check real-time weather information</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>
        </div>

        <p id="errorMessage"></p>

        <div id="loading">Loading...</div>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">Chennai</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="weatherDescription">Weather information</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <h3>Humidity</h3>
                    <p id="humidity">--%</p>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <h3>Wind Speed</h3>
                    <p id="windSpeed">-- km/h</p>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <h3>Feels Like</h3>
                    <p id="feelsLike">--°C</p>
                </div>

            </div>

        </div>

    </div>

    <script src="weather.js"></script>

</body>
</html>
