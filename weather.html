<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>My Dashboard</h2>

        <a href="#" class="active">Weather</a>
        <a href="#">Dashboard</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <h1>Weather Dashboard</h1>
        <p class="subtitle">
            Check live weather information by city.
        </p>


        <!-- Search -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>


        <!-- Loading -->
        <p id="loading">
            Loading...
        </p>


        <!-- Error -->
        <div id="errorMessage"></div>


        <!-- Weather -->
        <section id="weatherContainer">

            <div class="weather-header">
                <div>
                    <h2 id="cityName">Chennai</h2>
                    <p id="countryName">India</p>
                </div>

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>
            </div>


            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>


            <p id="weatherDescription">
                Weather information
            </p>


            <!-- Weather Cards -->
            <div class="weather-cards">

                <div class="weather-card">
                    <h3>💧</h3>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>


                <div class="weather-card">
                    <h3>💨</h3>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>


                <div class="weather-card">
                    <h3>🌡️</h3>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="weather.js"></script>

</body>
</html>
